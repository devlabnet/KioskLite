<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>KioskLite</title>
<style>
body {
    margin: 0;
    background: #202124;
    color: #f1f3f4;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}
main {
    max-width: 700px;
    padding: 40px;
    text-align: center;
}
h1 {
    font-size: 3em;
    margin-bottom: 0.3em;
}
p {
    font-size: 1.4em;
    line-height: 1.5;
}
code {
    background: #303134;
    padding: 5px 10px;
    border-radius: 5px;
}
</style>
</head>

<body>
<main>
    <h1>KioskLite</h1>

    <p>Aucune URL valide n'est configurée.</p>

    <p>
        Éteignez KioskLite et insérez la carte SD
        dans votre ordinateur.
    </p>

    <p>
        Modifiez le fichier <code>kiosklite.conf</code>
        présent sur la partition de démarrage.
    </p>

    <p>
        Exemple :<br><br>
        <code>URL=https://www.example.com</code>
    </p>
</main>
</body>
</html>
